    const getLevelInfo = (points) => {
      const level = Math.floor(points / 100) + 1;
      const currentLevelProgress = points % 100;
      const ranks = [
        { min: 1, title: 'Cadet Variable', badge: '🌱', color: 'text-emerald-400' },
        { min: 2, title: 'Algebra Scout', badge: '⚡', color: 'text-cyan-400' },
        { min: 3, title: 'Factor Specialist', badge: '🔮', color: 'text-violet-400' },
        { min: 4, title: 'Linear Strategist', badge: '🎯', color: 'text-orange-400' },
        { min: 6, title: 'SPLDV Commander', badge: '🚀', color: 'text-emerald-300' },
        { min: 8, title: 'Nexus Grandmaster', badge: '👑', color: 'text-amber-300' }
      ];
      let rank = ranks[0];
      for (const r of ranks) {
        if (level >= r.min) rank = r;
      }
      return { level, currentLevelProgress, nextLevelPoints: 100, rank };
    };

    // Helper: Generate all valid SMK classes
    // Kelas: X, XI, XII
    // Jurusan: KGS, TEK, TITL, TFLM, SIJA (pakai nomor 1 dan 2 saja)
    // Jurusan: TKR, TBKR (tanpa nomor)
    const generateValidClassList = () => {
      const { grades, majors, numbers } = window.NEXUS_DATA.schoolConfig;
      const list = [];
      grades.forEach((g) => {
        majors.forEach((m) => {
          if (m.numbered) {
            numbers.forEach((num) => {
              list.push(`${g} ${m.code} ${num}`);
            });
          } else {
            list.push(`${g} ${m.code}`);
          }
        });
      });
      return list;
    };

    // ========================================================================
    // COMPONENT 1B: HALAMAN LOGIN KHUSUS (TERPISAH DARI HALAMAN AWAL)
    // ========================================================================
    function LoginScreen({ accountsDB, onBackToLanding, onLogin, onDeleteSavedAccount, onLoadDemo }) {
      const { grades, majors, numbers } = window.NEXUS_DATA.schoolConfig;

      const [name, setName] = useState('');
      const [selectedGrade, setSelectedGrade] = useState('XI');
      const [selectedMajor, setSelectedMajor] = useState('SIJA');
      const [selectedNumber, setSelectedNumber] = useState('1');
      const [avatar, setAvatar] = useState('🦸‍♂️');
      const [error, setError] = useState('');

      const avatars = ['🦸‍♂️', '🦸‍♀️', '🤖', '🥷', '🧙‍♂️', '🚀'];

      const majorObj = majors.find((m) => m.code === selectedMajor) || majors[0];
      const isNumberedMajor = majorObj.numbered;

      // Format Kelas Otomatis: contoh "XI SIJA 1", "XI SIJA 2", atau "XI TKR", "XI TBKR"
      const formattedKelas = isNumberedMajor
        ? `${selectedGrade} ${selectedMajor} ${selectedNumber}`
        : `${selectedGrade} ${selectedMajor}`;

      const savedAccountsList = Object.entries(accountsDB || {});

      const matchingSavedId = name.trim()
        ? makeAccountId(name, formattedKelas)
        : null;
      const existingProfile =
        matchingSavedId && accountsDB[matchingSavedId]
          ? accountsDB[matchingSavedId]
          : null;

      const handleSubmit = (e) => {
        e.preventDefault();
        const trimmedName = name.trim();
        if (!trimmedName) {
          setError('Harap masukkan Nama atau Username kamu terlebih dahulu!');
          window.NexusSound.wrong();
          return;
        }
        window.NexusSound.levelUp();
        onLogin({
          name: trimmedName,
          kelas: formattedKelas,
          avatar
        });
      };

      return (
        <div className="min-h-screen flex flex-col justify-between relative overflow-hidden px-4 py-6 sm:py-8">

              <span>Kembali ke Halaman Awal</span>

              <span className="font-display font-bold text-sm text-white">
                NEXUS <span className="text-indigo-400">MATH</span>
              </span>
            </div>
          </header>

          {/* Centered Dedicated Login Content */}
          <main className="max-w-xl w-full mx-auto my-auto py-8 space-y-6 z-10 animate-fade-slide">
            {/* Saved Accounts Section (if any) */}
            {savedAccountsList.length > 0 && (
              <div className="glass-panel rounded-2xl p-5 space-y-3 border border-slate-700/80">

                  <span className="text-xs font-mono uppercase font-bold text-emerald-400">

                  </span>
                  <span className="text-[11px] font-mono text-slate-400">
                    {savedAccountsList.length} Akun
                  </span>
                </div>

                <div className="space-y-2.5 max-h-52 overflow-y-auto pr-1">
                  {savedAccountsList.map(([accId, prof]) => {
                    const lv = getLevelInfo(prof.points || 0).level;
                    const modDone = (prof.completedModules || []).length;
                    return (
                      <div
                        key={accId}
                        className="p-3 rounded-xl bg-slate-900/90 hover:bg-slate-800/90 border border-slate-700/80 hover:border-indigo-400/50 transition flex items-center justify-between gap-3"

    function MateriView({
      state,
      initialCategory,
      onToggleCompleteModule,
      onAnswerMiniQuiz
    }) {
      const [categoryFilter, setCategoryFilter] = useState(initialCategory || 'all');
      const [selectedModuleId, setSelectedModuleId] = useState('alg-1');

      const [simP, setSimP] = useState(2);
      const [simQ, setSimQ] = useState(3);
      const [spldvSim, setSpldvSim] = useState({ a1: 1, b1: 1, c1: 5, a2: 1, b2: -1, c2: 1 });

      useEffect(() => {
        if (initialCategory === 'aljabar') {
          setCategoryFilter('aljabar');
          setSelectedModuleId('alg-1');
        } else if (initialCategory === 'spldv') {
          setCategoryFilter('spldv');
          setSelectedModuleId('spldv-1');
        }
      }, [initialCategory]);

      const modules = window.NEXUS_DATA.modules;
      const completedModules = state.completedModules || [];
      const totalDone = completedModules.length;
      const aljabarDone = completedModules.filter((id) => id.startsWith('alg-')).length;
      const spldvDone = completedModules.filter((id) => id.startsWith('spldv-')).length;

      const filteredModules = modules.filter((m) =>
        categoryFilter === 'all' ? true : m.category === categoryFilter
      );

      const activeModule =
        modules.find((m) => m.id === selectedModuleId) || filteredModules[0] || modules[0];

      const isCurrentCompleted = completedModules.includes(activeModule.id);
      const selectedQuizAnswer = state.moduleQuizDone[activeModule.id];

      const spldvSolution = useMemo(() => {
        const { a1, b1, c1, a2, b2, c2 } = spldvSim;
        const det = a1 * b2 - a2 * b1;

          valid: true,

                        className="w-14 px-1.5 py-1 rounded bg-slate-800 text-center text-emerald-300 border border-slate-700"
                      />
                    </div>
                  </div>
                  <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800 font-mono text-xs">
                    {spldvSolution.valid ? (
                      <div className="space-y-1">
                        <div className="text-slate-300">
                          Determinan Sistem: <span className="text-sky-300">{spldvSolution.det}</span>
                        </div>
                        <div className="text-sm font-bold text-emerald-300">
                          Solusi Titik Potong (x, y) = ({spldvSolution.x}, {spldvSolution.y})
                        </div>
                      </div>
                    ) : (
                      <div className="text-amber-300">{spldvSolution.message}</div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // MINI-GAME 1 ENGINE: DRAG & DROP EXPRESSIONS REACTOR (BELAJAR RINGAN)
    // ========================================================================
    function Game1DragDropReactor({ levelData, selectedLevel, onRecordGameAnswer, onCompleteRound }) {
      const [waveIdx, setWaveIdx] = useState(0);
      const [matchedIds, setMatchedIds] = useState([]);
      const [draggedId, setDraggedId] = useState(null);
      const [selectedCapsuleId, setSelectedCapsuleId] = useState(null);
      const [hoverSlotId, setHoverSlotId] = useState(null);
      const [wrongSlotId, setWrongSlotId] = useState(null);
      const [feedbackMsg, setFeedbackMsg] = useState('Tarik (Drag) kapsul di sebelah kiri lalu jatuhkan (Drop) ke Reaktor jawaban yang tepat di sebelah kanan!');
      const [sessionScore, setSessionScore] = useState(0);
      const [sessionCorrect, setSessionCorrect] = useState(0);
      const [totalAttempts, setTotalAttempts] = useState(0);
      const [timeLeft, setTimeLeft] = useState(levelData.timeLimit || 90);
      const [stepStartTime, setStepStartTime] = useState(Date.now());

      const currentWave = levelData.waves[waveIdx];

      const shuffledTargets = useMemo(() => {
        if (!currentWave) return [];
        const copy = [...currentWave.items];
        if (copy.length >= 4) {
          return [copy[2], copy[0], copy[3], copy[1]];
        }
        return copy.reverse();
      }, [waveIdx, selectedLevel]);

      useEffect(() => {
        setWaveIdx(0);
        setMatchedIds([]);
        setDraggedId(null);
        setSelectedCapsuleId(null);
        setSessionScore(0);
        setSessionCorrect(0);
        setTotalAttempts(0);
        setTimeLeft(levelData.timeLimit || 90);
        setStepStartTime(Date.now());
        setFeedbackMsg('Tarik (Drag) kapsul di sebelah kiri lalu jatuhkan (Drop) ke Reaktor jawaban yang tepat di sebelah kanan!');
      }, [selectedLevel]);

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              onCompleteRound({
                sessionScore,
                sessionCorrect,
                totalQuestions: Math.max(totalAttempts, 8)
              });
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [selectedLevel, sessionScore, sessionCorrect, totalAttempts]);

      const verifyMatch = (sourceId, targetItem) => {
        if (!sourceId || matchedIds.includes(sourceId)) return;
        const elapsedSec = Math.max(1, Math.round((Date.now() - stepStartTime) / 1000));
        setStepStartTime(Date.now());
        setTotalAttempts((p) => p + 1);

        if (sourceId === targetItem.id) {
          window.NexusSound.dropSnap();
          window.NexusSound.correct();
          const pts = levelData.pointsPerCorrect;
          const nextMatched = [...matchedIds, sourceId];
          setMatchedIds(nextMatched);
          setSessionScore((s) => s + pts);
          setSessionCorrect((c) => c + 1);
          setSelectedCapsuleId(null);
          setDraggedId(null);
          setFeedbackMsg(`✅ Tepat Sekali! ${targetItem.expr} = ${targetItem.target} (+${pts} Poin)`);

          onRecordGameAnswer({
            gameId: 'game-speed',
            level: selectedLevel,
            isCorrect: true,
            pointsEarned: pts,
            elapsedSec
          });

          if (nextMatched.length === currentWave.items.length) {
            setTimeout(() => {
              if (waveIdx + 1 < levelData.waves.length) {
                window.NexusSound.levelUp();
                setWaveIdx((w) => w + 1);
                setMatchedIds([]);
                setFeedbackMsg('🚀 Gelombang 1 Selesai! Lanjut ke Gelombang 2!');
              } else {
                window.NexusSound.levelUp();
                onCompleteRound({
                  sessionScore: sessionScore + pts,
                  sessionCorrect: sessionCorrect + 1,
                  totalQuestions: totalAttempts + 1
                });
              }
            }, 650);
          }
        } else {
          window.NexusSound.wrong();
          setWrongSlotId(targetItem.id);
          setTimeout(() => setWrongSlotId(null), 500);
          const sourceItem = currentWave.items.find((i) => i.id === sourceId);
          setFeedbackMsg(
            `💡 Belum pas! Petunjuk untuk "${sourceItem ? sourceItem.expr : ''}": ${
              sourceItem ? sourceItem.hint : 'Hitung angka di depan huruf yang sama!'
            }`
          );
          onRecordGameAnswer({
            gameId: 'game-speed',
            level: selectedLevel,
            isCorrect: false,
            pointsEarned: 0,
            elapsedSec
          });
        }
      };

      return (
        <div className="glass-panel rounded-2xl p-6 sm:p-8 border border-slate-800 space-y-6">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
              <div className="text-[10px] font-mono text-slate-400 uppercase">GELOMBANG DRAG-DROP</div>
              <div className="font-display text-lg font-bold text-white">
                Wave {waveIdx + 1} / {levelData.waves.length}
              </div>
            </div>
            <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
              <div className="text-[10px] font-mono text-slate-400 uppercase">REAKTOR TERISI</div>
              <div className="font-display text-lg font-bold text-sky-400">
                {matchedIds.length} / {currentWave.items.length} Kapsul
              </div>
            </div>
            <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
              <div className="text-[10px] font-mono text-slate-400 uppercase">WAKTU SANTAI</div>
              <div className={`font-display text-lg font-bold ${timeLeft <= 10 ? 'text-rose-400 animate-pulse' : 'text-indigo-300'}`}>
                ⏱ {timeLeft} dtk
              </div>
            </div>
            <div className="p-3 rounded-xl bg-slate-900/90 border border-emerald-500/30">
              <div className="text-[10px] font-mono text-slate-400 uppercase">POIN SESI</div>
              <div className="font-display text-lg font-bold text-emerald-400">
                +{sessionScore} PTS
              </div>
            </div>
          </div>

          <div className="p-4 rounded-xl bg-slate-950/90 border border-slate-800 flex items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <span className="text-2xl">🧲</span>
              <div>
                <div className="text-xs font-mono text-emerald-400 uppercase font-bold">
                  {currentWave.waveTitle} • Tarik &amp; Jatuhkan (Atau Klik Kiri lalu Klik Kanan)
                </div>
                <div className="text-sm text-slate-300 mt-0.5">{feedbackMsg}</div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <div className="space-y-3">
              <div className="flex items-center justify-between px-1">
                <span className="text-xs font-mono uppercase font-bold text-sky-300">
                  📦 KAPSUL SOAL ALJABAR (TARIK DARI SINI)
                </span>
                <span className="text-[11px] font-mono text-slate-400">Drag / Klik</span>
              </div>

              {currentWave.items.map((item) => {
                const isMatched = matchedIds.includes(item.id);
                const isSelected = selectedCapsuleId === item.id;
                return (
                  <div
                    key={item.id}
                    draggable={!isMatched}
                    onDragStart={(e) => {
                      if (isMatched) return;
                      window.NexusSound.dragPickup();
                      setDraggedId(item.id);
                      setSelectedCapsuleId(item.id);
                      e.dataTransfer.setData('text/plain', item.id);
                    }}
                    onDragEnd={() => {
                      setDraggedId(null);
                      setHoverSlotId(null);
                    }}
                    onClick={() => {
                      if (isMatched) return;
                      window.NexusSound.dragPickup();
                      setSelectedCapsuleId(item.id === selectedCapsuleId ? null : item.id);
                    }}
                    className={`p-4 rounded-2xl border transition flex items-center justify-between gap-3 ${
                      isMatched
                        ? 'bg-slate-900/40 border-slate-800 text-slate-600 opacity-45 cursor-not-allowed'
                        : isSelected
                        ? 'draggable-capsule bg-indigo-500/20 border-indigo-400 text-white glow-cyan scale-[1.01]'
                        : 'draggable-capsule bg-slate-900/90 border-slate-700 text-white hover:border-indigo-400'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <span className="w-8 h-8 rounded-lg bg-slate-950 border border-slate-700 flex items-center justify-center text-xs font-mono">
                        {isMatched ? '✓' : '⠿'}
                      </span>
                      <span className="font-mono-math text-lg font-bold">
                        {item.expr}
                      </span>
                    </div>
                    <span className="text-[11px] font-mono px-2.5 py-1 rounded-lg bg-slate-950 text-sky-300 border border-slate-800">
                      {isMatched ? 'Selesai ✓' : isSelected ? 'Klik Kanan →' : 'Tarik ➔'}
                    </span>
                  </div>
                );
              })}
            </div>

            <div className="space-y-3">
              <div className="flex items-center justify-between px-1">
                <span className="text-xs font-mono uppercase font-bold text-emerald-400">
                  ⚡ SLOT REAKTOR JAWABAN (DROP KE SINI)
                </span>
                <span className="text-[11px] font-mono text-slate-400">+{levelData.pointsPerCorrect} PTS / Slot</span>
              </div>

              {shuffledTargets.map((targetItem) => {
                const isFilled = matchedIds.includes(targetItem.id);
                const isHovered = hoverSlotId === targetItem.id;
                const isWrong = wrongSlotId === targetItem.id;

                return (
                  <div
                    key={targetItem.id}
                    onDragOver={(e) => {
                      e.preventDefault();
                      if (!isFilled && hoverSlotId !== targetItem.id) {
                        setHoverSlotId(targetItem.id);
                      }
                    }}
                    onDragLeave={() => setHoverSlotId(null)}
                    onDrop={(e) => {
                      e.preventDefault();
                      setHoverSlotId(null);
                      const droppedId = e.dataTransfer.getData('text/plain') || draggedId;
                      verifyMatch(droppedId, targetItem);
                    }}
                    onClick={() => {
                      if (!isFilled && selectedCapsuleId) {
                        verifyMatch(selectedCapsuleId, targetItem);
                      }
                    }}
                    className={`p-4 rounded-2xl border transition cursor-pointer flex items-center justify-between gap-3 ${
                      isFilled
                        ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-200 glow-green'
                        : isWrong
                        ? 'bg-rose-500/20 border-rose-500/50 text-rose-200 animate-shake'
                        : isHovered
                        ? 'drop-slot-highlight'
                        : selectedCapsuleId
                        ? 'bg-slate-950/90 border-dashed border-sky-400/60 hover:bg-sky-500/10'
                        : 'bg-slate-950/85 border-dashed border-slate-700 hover:border-emerald-400/50'
                    }`}
                  >
                    <div>
                      <div className="text-[10px] font-mono uppercase text-slate-400">
                        {isFilled ? `✓ PASANGAN DARI: ${targetItem.expr}` : 'HASIL SEDERHANA:'}
                      </div>
                      <div className="font-mono-math text-xl font-extrabold text-emerald-300 mt-0.5">
                        = {targetItem.target}
                      </div>
                    </div>

                    <div className="px-3 py-1.5 rounded-xl font-mono text-xs font-bold bg-slate-900 border border-slate-700 text-slate-300">
                      {isFilled ? '🔒 Aktif' : selectedCapsuleId ? '📥 Klik Drop' : '📥 Drop Zone'}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // MINI-GAME 2 ENGINE: KOTAK MISTERI ALJABAR (1-KLIK ISI ANGKA HILANG)
    // ========================================================================
    function Game2FactorPuzzleBuilder({ levelData, selectedLevel, onRecordGameAnswer, onCompleteRound }) {
      const boxes = levelData.boxes;
      const [boxIdx, setBoxIdx] = useState(0);
      const [chosenVal, setChosenVal] = useState(null);
      const [status, setStatus] = useState(null); // null | 'correct' | 'wrong'
      const [sessionScore, setSessionScore] = useState(0);
      const [sessionCorrect, setSessionCorrect] = useState(0);
      const [startTime, setStartTime] = useState(Date.now());

      const currentBox = boxes[boxIdx];

      useEffect(() => {
        setBoxIdx(0);
        setChosenVal(null);
        setStatus(null);
        setSessionScore(0);
        setSessionCorrect(0);
        setStartTime(Date.now());
      }, [selectedLevel]);

      const handlePickNumber = (val) => {
        if (status === 'correct') return;
        const elapsedSec = Math.max(1, Math.round((Date.now() - startTime) / 1000));
        setChosenVal(val);

        if (String(val) === String(currentBox.answer)) {
          window.NexusSound.dropSnap();
          window.NexusSound.correct();
          const pts = levelData.pointsPerCorrect;
          setStatus('correct');
          setSessionScore((s) => s + pts);
          setSessionCorrect((c) => c + 1);
          onRecordGameAnswer({
            gameId: 'game-factor',
            level: selectedLevel,
            isCorrect: true,
            pointsEarned: pts,
            elapsedSec
          });
        } else {
          window.NexusSound.wrong();
          setStatus('wrong');
          onRecordGameAnswer({
            gameId: 'game-factor',
            level: selectedLevel,
            isCorrect: false,
            pointsEarned: 0,
            elapsedSec
          });
        }
      };

      const handleNextBox = () => {
        window.NexusSound.click();
        if (boxIdx + 1 < boxes.length) {
          setBoxIdx((i) => i + 1);
          setChosenVal(null);
          setStatus(null);
          setStartTime(Date.now());
        } else {
          window.NexusSound.levelUp();
          onCompleteRound({
            sessionScore,
            sessionCorrect,
            totalQuestions: boxes.length
          });
        }
      };

      return (
        <div className="glass-panel rounded-2xl p-6 sm:p-8 border border-slate-800 space-y-6">
          <div className="grid grid-cols-3 gap-3">
            <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
              <div className="text-[10px] font-mono text-slate-400">KOTAK MISTERI</div>
              <div className="font-display text-lg font-bold text-white">
                #{boxIdx + 1} / {boxes.length}
              </div>
            </div>
            <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
              <div className="text-[10px] font-mono text-slate-400">POIN PER SOAL</div>
              <div className="font-display text-lg font-bold text-indigo-300">
                +{levelData.pointsPerCorrect} PTS
              </div>
            </div>
            <div className="p-3 rounded-xl bg-slate-900/90 border border-emerald-500/30">
              <div className="text-[10px] font-mono text-slate-400">POIN SESI INI</div>
              <div className="font-display text-lg font-bold text-emerald-400">
                +{sessionScore} PTS
              </div>
            </div>
          </div>

          <div className="p-6 sm:p-8 rounded-2xl bg-slate-950/90 border border-slate-800 text-center space-y-5">
            <span className="px-3.5 py-1 rounded-full text-xs font-mono bg-indigo-500/15 text-indigo-300 border border-indigo-500/30">
              🔢 KLIK 1 ANGKA UNTUK MENGISI KOTAK MISTERI [ ? ]
            </span>

            {/* Persamaan dengan 1 Kotak Misteri [ ? ] */}
            <div className="py-4 flex flex-wrap items-center justify-center gap-3 font-mono-math text-2xl sm:text-3xl font-extrabold text-white">
              <span>{currentBox.leftSide}</span>
              <span
                className={`min-w-[84px] px-5 py-2.5 rounded-2xl border-2 inline-flex items-center justify-center transition-all ${
                  status === 'correct'
                    ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300 glow-green scale-105'
                    : status === 'wrong'
                    ? 'bg-rose-500/20 border-rose-400 text-rose-300 animate-shake'
                    : 'bg-slate-900 border-dashed border-sky-400 text-sky-300 animate-pulse'
                }`}
              >
                {chosenVal !== null ? chosenVal : '?'}
              </span>
              {currentBox.rightSide && <span>{currentBox.rightSide}</span>}
            </div>

            <div className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs sm:text-sm font-mono text-slate-300 max-w-xl mx-auto">
              💡 <strong className="text-emerald-400">Petunjuk Mudah:</strong> {currentBox.clue}
            </div>
          </div>

          {/* 6 Pilihan Tombol Angka (Langsung Klik 1 Saja) */}
          <div className="space-y-3">
            <div className="text-xs font-mono uppercase text-sky-300 font-bold text-center">
              👇 KLIK SALAH SATU ANGKA DI BAWAH UNTUK MENGISI KOTAK [ ? ]:
            </div>
            <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
              {currentBox.choices.map((val) => {
                const isChosen = String(chosenVal) === String(val);
                const isRight = isChosen && status === 'correct';
                const isWrong = isChosen && status === 'wrong';

                return (
                  <button
                    key={val}
                    disabled={status === 'correct'}
                    onClick={() => handlePickNumber(val)}
                    className={`py-4 rounded-2xl font-mono-math font-extrabold text-xl border transition ${
                      isRight
                        ? 'bg-emerald-500 text-white border-emerald-400 glow-green scale-105'
                        : isWrong
                        ? 'bg-rose-500/25 border-rose-500/50 text-rose-200'
                        : 'bg-slate-900/90 border-slate-700 text-white hover:border-indigo-400 hover:bg-slate-800 active:scale-95'
                    }`}
                  >
                    {val}
                  </button>
                );
              })}
            </div>
          </div>

          {status === 'wrong' && (
            <div className="p-4 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-200 text-xs sm:text-sm font-mono text-center animate-shake">
              💡 Angka <strong>{chosenVal}</strong> belum tepat! Coba lihat petunjuk di atas lalu klik angka lainnya!
            </div>
          )}

          {status === 'correct' && (
            <div className="p-5 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 space-y-3 animate-pop">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="font-display font-bold text-lg text-emerald-300">
                  ✅ Tepat Sekali! Kotak terisi dengan angka {chosenVal} (+{levelData.pointsPerCorrect} Poin)
                </div>
                <button
                  onClick={handleNextBox}
                  className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-display font-bold text-sm transition"
                >
                  {boxIdx + 1 < boxes.length ? 'Kotak Misteri Berikutnya →' : 'Selesaikan Misi 🏆'}
                </button>
              </div>
              <p className="text-xs sm:text-sm font-mono text-slate-300">
                {currentBox.explanation}
              </p>
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // MINI-GAME 3 ENGINE: SPLDV HUNTER — 1-KLIK KARTU JURUS SERANG BOSS!
    // ========================================================================
    function Game3HeroVillainBattle({
      user,
      levelData,
      selectedLevel,
      onRecordGameAnswer,
      onCompleteRound
    }) {
      const boss = levelData.boss;
      const battles = levelData.battles;

      const [battleIdx, setBattleIdx] = useState(0);
      const [heroHp, setHeroHp] = useState(100);
      const [bossHp, setBossHp] = useState(boss.maxHp);
      const [selectedOptionIdx, setSelectedOptionIdx] = useState(null);
      const [combatState, setCombatState] = useState('idle');
      const [combatLog, setCombatLog] = useState(boss.taunt);
      const [damagePopup, setDamagePopup] = useState(null);
      const [sessionScore, setSessionScore] = useState(0);
      const [sessionCorrect, setSessionCorrect] = useState(0);
      const [turnStartTime, setTurnStartTime] = useState(Date.now());

      const currentBattle = battles[battleIdx];

      useEffect(() => {
        setBattleIdx(0);
        setHeroHp(100);
        setBossHp(levelData.boss.maxHp);
        setSelectedOptionIdx(null);
        setCombatState('idle');
        setCombatLog(levelData.boss.taunt);
        setDamagePopup(null);
        setSessionScore(0);
        setSessionCorrect(0);
        setTurnStartTime(Date.now());
      }, [selectedLevel]);

      const handleSelectAttackCard = (opt, idx) => {
        if (combatState === 'turn-won') return;
        setSelectedOptionIdx(idx);
        const elapsedSec = Math.max(1, Math.round((Date.now() - turnStartTime) / 1000));

        if (opt.isCorrect) {
          window.NexusSound.laserAttack();
          const dmg = currentBattle.damage;
          const pts = levelData.pointsPerCorrect;

          setCombatState('hero-attack');
          setDamagePopup({ target: 'boss', text: `-${dmg} HP!` });
          const nextBossHp = Math.max(0, bossHp - dmg);
          setBossHp(nextBossHp);
          setSessionScore((s) => s + pts);
          setSessionCorrect((c) => c + 1);

          setCombatLog(
            `⚔️ SERANGAN TELAK! Jurus (${opt.label}) menghancurkan perisai ${boss.name}! (${currentBattle.explanation})`
          );

          onRecordGameAnswer({
            gameId: 'game-hunter',
            level: selectedLevel,
            isCorrect: true,
            pointsEarned: pts,
            elapsedSec
          });

          setTimeout(() => {
            setDamagePopup(null);
            setCombatState('turn-won');
            if (nextBossHp <= 0) {
              window.NexusSound.bossDefeated();
            }
          }, 600);
        } else {
          window.NexusSound.heroHurt();
          setCombatState('villain-attack');
          const enemyDmg = boss.attackDamage;
          setDamagePopup({ target: 'hero', text: `-${enemyDmg} HP!` });
          const nextHeroHp = Math.max(10, heroHp - enemyDmg);
          setHeroHp(nextHeroHp);

          setCombatLog(
            `💥 ${boss.name} menangkis seranganmu! Petunjuk: ${currentBattle.explanation}`
          );

          onRecordGameAnswer({
            gameId: 'game-hunter',
            level: selectedLevel,
            isCorrect: false,
            pointsEarned: 0,
            elapsedSec
          });

          setTimeout(() => {
            setDamagePopup(null);
            setCombatState('idle');
          }, 600);
        }
      };

      const handleNextTurn = () => {
        window.NexusSound.click();
        if (battleIdx + 1 < battles.length && bossHp > 0) {
          const nextIdx = battleIdx + 1;
          setBattleIdx(nextIdx);
          setSelectedOptionIdx(null);
          setCombatState('idle');
          setCombatLog(`${boss.name} memasang perisai persamaan tahap ke-${nextIdx + 1}!`);
          setTurnStartTime(Date.now());
        } else {
          window.NexusSound.bossDefeated();
          onCompleteRound({
            sessionScore,
            sessionCorrect,
            totalQuestions: battles.length
          });
        }
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel rounded-2xl p-6 border border-slate-800 relative overflow-hidden">

                      <span className="text-xs font-mono font-bold text-emerald-400">

                    </div>
                    <h4 className="font-display text-lg font-bold text-white mt-1">
                      {user.name}
                    </h4>
                    <div className="w-full h-2.5 rounded-full bg-slate-950 overflow-hidden border border-slate-800 mt-1.5">
                      <div
                        className="h-full bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-500"
                        style={{ width: `${heroHp}%` }}

                    </div>
                  </div>
                </div>
              </div>

              <div className="md:col-span-2 flex flex-col items-center justify-center text-center">
                <div className="w-12 h-12 rounded-full bg-indigo-600 border border-indigo-400 flex items-center justify-center font-display font-extrabold text-white shadow-md">
                  VS
                </div>
                <span className="text-[11px] font-mono text-slate-400 mt-1.5">
                  Babak {battleIdx + 1}/{battles.length}
                </span>
                <span className="text-xs font-mono text-emerald-400 font-bold">
                  +{sessionScore} PTS
                </span>
              </div>

              <div
                className={`md:col-span-5 p-4 rounded-2xl bg-slate-900/90 border border-rose-500/40 transition ${
                  combatState === 'villain-attack'
                    ? 'animate-villain-attack'
                    : combatState === 'hero-attack'
                    ? 'animate-hit-flash'
                    : ''
                }`}
              >
                <div className="flex items-center gap-4">
                  <div className="flex-1 text-right">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-mono font-bold text-rose-400">
                        💀 {bossHp}/{boss.maxHp} HP
                      </span>
                      <span className="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-rose-500/15 text-rose-300 font-bold">
                        PENJAHAT LV.{selectedLevel}
                      </span>
                    </div>
                    <h4 className="font-display text-lg font-bold text-white mt-1">
                      {boss.name}
                    </h4>
                    <div className="w-full h-2.5 rounded-full bg-slate-950 overflow-hidden border border-slate-800 mt-1.5">
                      <div
                        className="h-full bg-gradient-to-r from-rose-600 to-amber-500 transition-all duration-500"
                        style={{ width: `${(bossHp / boss.maxHp) * 100}%` }}
                      ></div>
                    </div>
                  </div>

                  <div className="relative">
                    <div className="w-16 h-16 rounded-2xl bg-rose-500/15 border border-rose-500/40 flex items-center justify-center text-4xl animate-float">
                      {bossHp <= 0 ? '💥' : boss.avatar}
                    </div>
                    {damagePopup && damagePopup.target === 'boss' && (
                      <span className="absolute -top-6 right-0 font-display font-extrabold text-emerald-400 text-lg animate-damage-float whitespace-nowrap">
                        {damagePopup.text}
                      </span>
                    )}
                  </div>
                </div>
              </div>
            </div>

            <div className="mt-4 p-3.5 rounded-xl bg-slate-950/90 border border-slate-800 text-xs sm:text-sm font-mono text-slate-300 flex items-center gap-3">
              <span className="text-lg">📡</span>
              <span>{combatLog}</span>
            </div>
          </div>

          <div className="glass-panel rounded-2xl p-6 border border-slate-800 space-y-6">
            <div className="p-5 rounded-2xl bg-slate-950/90 border border-slate-800 space-y-4">
              <div className="flex items-center justify-between">
                <span className="text-xs font-mono uppercase text-sky-400 font-bold">
                  🛡️ PERISAI SOAL PENJAHAT ({boss.name})
                </span>
                <span className="text-xs font-mono text-emerald-400 font-bold">
                  +{levelData.pointsPerCorrect} Poin / Serangan Tepat
                </span>
              </div>

              <p className="text-sm sm:text-base text-slate-200 font-medium leading-relaxed">
                {currentBattle.story}
              </p>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {currentBattle.system.map((eq, idx) => (
                  <div
                    key={idx}
                    className="p-3.5 rounded-xl bg-slate-900 border border-slate-700 text-center font-mono-math text-lg font-bold text-sky-300"
                  >
                    Persamaan ({idx + 1}): {eq}
                  </div>
                ))}
              </div>
            </div>

            {/* 4 KARTU JURUS SERANGAN (KLIK 1 KARTU LANGSUNG MENEMBAK LASER KE BOSS!) */}
            <div className="space-y-3">
              <div className="text-xs font-mono uppercase text-emerald-400 font-bold">
                ⚡ KLIK 1 KARTU JURUS JAWABAN DI BAWAH UNTUK LANGSUNG MENYERANG {boss.name.toUpperCase()}:
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                {currentBattle.options.map((opt, idx) => {
                  const isPicked = selectedOptionIdx === idx;
                  const isWonCard = combatState === 'turn-won' && opt.isCorrect;
                  const isWrongCard = isPicked && !opt.isCorrect && combatState !== 'turn-won';

                  return (
                    <button
                      key={idx}
                      disabled={combatState === 'turn-won'}
                      onClick={() => handleSelectAttackCard(opt, idx)}
                      className={`p-4 rounded-2xl border text-left transition flex items-center justify-between gap-3 ${
                        isWonCard
                          ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200 glow-green'
                          : isWrongCard
                          ? 'bg-rose-500/20 border-rose-500/50 text-rose-200'
                          : 'bg-slate-900/90 hover:bg-slate-800 border-slate-700 hover:border-indigo-400 text-white active:scale-[0.99]'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <span className="w-9 h-9 rounded-xl bg-slate-950 border border-slate-700 flex items-center justify-center font-display font-bold text-sm text-sky-300 shrink-0">

                        </span>
                        <div>
                          <div className="text-[10px] font-mono uppercase text-slate-400">
                            KARTU JURUS {String.fromCharCode(65 + idx)}

                          <div className="font-mono-math text-base sm:text-lg font-extrabold text-white">
                            {opt.label}
                          </div>
                        </div>
                      </div>
                      <span className="px-3 py-1.5 rounded-xl bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 font-mono text-xs font-bold shrink-0">
                        {isWonCard ? '✓ TELAK!' : 'Serang ▶'}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            {combatState === 'turn-won' && (
              <button
                onClick={handleNextTurn}
                className="w-full py-4 rounded-xl font-display font-bold text-base text-white bg-indigo-600 hover:bg-indigo-500 transition shadow-md animate-pop"
              >
                {bossHp <= 0
                  ? `🏆 ${boss.name.toUpperCase()} KALAH! KLAIM KEMENANGAN!`
                  : '⚔️ LANJUT KE SERANGAN BERIKUTNYA →'}

    // ========================================================================
    // MINI-GAME 4 ENGINE: CARTESIAN RADAR SNIPER
    // Mode Mudah: Garis & Titik terlihat.
    // Mode Sedang & Sulit: Diagram Kartesius Polos (Cari sendiri koordinatnya!)
    // ========================================================================
    function Game4RadarSniperDuel({
      levelData,
      selectedLevel,
      onRecordGameAnswer,
      onCompleteRound
    }) {
      const missions = levelData.missions;
      const [missionIdx, setMissionIdx] = useState(0);
      const [aimX, setAimX] = useState(0);
      const [aimY, setAimY] = useState(0);
      const [firedResult, setFiredResult] = useState(null);
      const [sessionScore, setSessionScore] = useState(0);
      const [sessionCorrect, setSessionCorrect] = useState(0);
      const [startTime, setStartTime] = useState(Date.now());

      const currentMission = missions[missionIdx];

      useEffect(() => {
        setMissionIdx(0);
        setAimX(0);
        setAimY(0);
        setFiredResult(null);
        setSessionScore(0);
        setSessionCorrect(0);
        setStartTime(Date.now());
      }, [selectedLevel]);

      const minCoord = -6;
      const maxCoord = 6;
      const size = 360;
      const step = size / (maxCoord - minCoord);
      const toSvgX = (x) => (x - minCoord) * step;
      const toSvgY = (y) => size - (y - minCoord) * step;

      const getLineSegment = (line) => {
        const { a, b, c } = line;
        const pts = [];
        if (Math.abs(b) > 0.0001) {
          pts.push({ x: minCoord, y: (c - a * minCoord) / b });
          pts.push({ x: maxCoord, y: (c - a * maxCoord) / b });
        } else if (Math.abs(a) > 0.0001) {
          const xVal = c / a;
          pts.push({ x: xVal, y: minCoord });
          pts.push({ x: xVal, y: maxCoord });
        }
        return pts;
      };

      const seg1 = getLineSegment(currentMission.line1);
      const seg2 = getLineSegment(currentMission.line2);

      // Di Mode Sedang & Sulit, garis dan titik TIDAK ditampilkan sebelum berhasil menembak!
      const showLinesOnGraph = currentMission.showLinesPreview || firedResult === 'hit';
      const showDotOnGraph = currentMission.showDotHint || firedResult === 'hit';

      const handleFireSniper = () => {
        if (firedResult === 'hit') return;
        const elapsedSec = Math.max(1, Math.round((Date.now() - startTime) / 1000));
        const isBullseye =
          aimX === currentMission.intersection.x &&
          aimY === currentMission.intersection.y;

        if (isBullseye) {
          window.NexusSound.laserAttack();
          window.NexusSound.correct();
          const pts = levelData.pointsPerCorrect;
          setFiredResult('hit');
          setSessionScore((s) => s + pts);
          setSessionCorrect((c) => c + 1);
          onRecordGameAnswer({
            gameId: 'game-graph',
            level: selectedLevel,
            isCorrect: true,
            pointsEarned: pts,
            elapsedSec
          });
        } else {
          window.NexusSound.wrong();
          setFiredResult('miss');
          onRecordGameAnswer({
            gameId: 'game-graph',
            level: selectedLevel,
            isCorrect: false,
            pointsEarned: 0,
            elapsedSec
          });
        }
      };

      const handleNextMission = () => {
        window.NexusSound.click();
        if (missionIdx + 1 < missions.length) {
          setMissionIdx((i) => i + 1);
          setAimX(0);
          setAimY(0);
          setFiredResult(null);
          setStartTime(Date.now());
        } else {
          window.NexusSound.levelUp();
          onCompleteRound({
            sessionScore,
            sessionCorrect,
            totalQuestions: missions.length
          });
        }
      };

      const gridValues = [];
      for (let i = minCoord; i <= maxCoord; i++) gridValues.push(i);

      return (
        <div className="glass-panel rounded-2xl p-6 sm:p-8 border border-slate-800 space-y-6">
          <div className="grid grid-cols-3 gap-3">
            <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
              <div className="text-[10px] font-mono text-slate-400">TARGET RADAR</div>
              <div className="font-display text-lg font-bold text-white">
                {missionIdx + 1} / {missions.length}
              </div>
            </div>
            <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
              <div className="text-[10px] font-mono text-slate-400">KOORDINAT BIDIKANMU</div>
              <div className="font-mono-math text-lg font-bold text-sky-300">
                ({aimX}, {aimY})
              </div>
            </div>
            <div className="p-3 rounded-xl bg-slate-900/90 border border-emerald-500/30">
              <div className="text-[10px] font-mono text-slate-400">POIN RADAR</div>
              <div className="font-display text-lg font-bold text-emerald-400">
                +{sessionScore} PTS
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
            <div className="lg:col-span-7 flex flex-col items-center">
              <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800 shadow-xl">
                <svg
                  viewBox={`0 0 ${size} ${size}`}
                  className="w-72 h-72 sm:w-80 sm:h-80 select-none cursor-crosshair"
                >
                  {gridValues.map((g) => (
                    <React.Fragment key={g}>
                      <line
                        x1={toSvgX(g)}
                        y1={0}
                        x2={toSvgX(g)}
                        y2={size}
                        stroke={g === 0 ? '#475569' : '#1e293b'}
                        strokeWidth={g === 0 ? 2 : 1}
                      />
                      <line
                        x1={0}
                        y1={toSvgY(g)}
                        x2={size}
                        y2={toSvgY(g)}
                        stroke={g === 0 ? '#475569' : '#1e293b'}
                        strokeWidth={g === 0 ? 2 : 1}
                      />
                      {g !== 0 && (
                        <>
                          <text
                            x={toSvgX(g)}
                            y={toSvgY(0) + 13}
                            fontSize="8.5"
                            fill="#94a3b8"
                            textAnchor="middle"
                          >
                            {g}
                          </text>
                          <text
                            x={toSvgX(0) - 5}
                            y={toSvgY(g) + 3}
                            fontSize="8.5"
                            fill="#94a3b8"
                            textAnchor="end"
                          >
                            {g}
                          </text>
                        </>
                      )}
                    </React.Fragment>
                  ))}

                  {/* Garis hanya tampil di Mode Mudah atau setelah tembakan tepat sasaran */}
                  {showLinesOnGraph && seg1.length === 2 && (
                    <line
                      x1={toSvgX(seg1[0].x)}
                      y1={toSvgY(seg1[0].y)}
                      x2={toSvgX(seg1[1].x)}
                      y2={toSvgY(seg1[1].y)}
                      stroke="#38bdf8"
                      strokeWidth="3"
                    />
                  )}
                  {showLinesOnGraph && seg2.length === 2 && (
                    <line
                      x1={toSvgX(seg2[0].x)}
                      y1={toSvgY(seg2[0].y)}
                      x2={toSvgX(seg2[1].x)}
                      y2={toSvgY(seg2[1].y)}
                      stroke="#818cf8"
                      strokeWidth="3"
                    />
                  )}

                  {/* Titik bantu hijau HANYA tampil di Mode Mudah (Level 1) atau setelah kena */}
                  {showDotOnGraph && (
                    <circle
                      cx={toSvgX(currentMission.intersection.x)}
                      cy={toSvgY(currentMission.intersection.y)}
                      r="6"
                      fill="rgba(16, 185, 129, 0.45)"
                    />
                  )}

                  {/* Clickable Grid Nodes */}
                  {gridValues.map((gx) =>
                    gridValues.map((gy) => (
                      <circle
                        key={`${gx},${gy}`}
                        cx={toSvgX(gx)}
                        cy={toSvgY(gy)}
                        r="9"
                        fill="transparent"
                        onClick={() => {
                          if (firedResult === 'hit') return;
                          window.NexusSound.click();
                          setAimX(gx);
                          setAimY(gy);
                          setFiredResult(null);
                        }}
                      />
                    ))
                  )}

                  {/* Player Sniper Crosshair */}
                  <g transform={`translate(${toSvgX(aimX)}, ${toSvgY(aimY)})`}>
                    <circle
                      r="12"
                      fill={firedResult === 'hit' ? 'rgba(16,185,129,0.28)' : 'rgba(99,102,241,0.22)'}
                      stroke={firedResult === 'hit' ? '#10b981' : '#6366f1'}
                      strokeWidth="2"
                    />
                    <line x1="-16" y1="0" x2="16" y2="0" stroke="#38bdf8" strokeWidth="1.5" />
                    <line x1="0" y1="-16" x2="0" y2="16" stroke="#38bdf8" strokeWidth="1.5" />
                    <circle r="3.5" fill="#38bdf8" />
                  </g>
                </svg>
              </div>
              <p className="text-xs font-mono text-slate-400 mt-2 text-center">
                {currentMission.showDotHint
                  ? '💡 Mode Mudah: Klik titik perpotongan garis pada grafik di atas lalu tekan TEMBAK!'
                  : '🔍 Mode Mandiri (Sedang/Sulit): Cari sendiri nilai (x, y) dari kedua persamaan, lalu klik titik koordinatnya di grafik!'}
              </p>
            </div>

            <div className="lg:col-span-5 space-y-4">
              <div className="p-5 rounded-2xl bg-slate-950/90 border border-slate-800 space-y-3">
                <span className="px-2.5 py-1 rounded-full text-[11px] font-mono bg-sky-500/15 text-sky-300 border border-sky-500/30">
                  🎯 {levelData.subtitle}
                </span>
                <h4 className="font-display text-lg font-bold text-white">
                  {currentMission.prompt}
                </h4>

                <div className="space-y-2 pt-1">
                  <div className="p-3 rounded-xl bg-slate-900 border border-slate-800 font-mono-math text-base font-bold text-sky-300">
                    Persamaan Garis 1: {currentMission.line1.label}
                  </div>
                  <div className="p-3 rounded-xl bg-slate-900 border border-slate-800 font-mono-math text-base font-bold text-indigo-300">
                    Persamaan Garis 2: {currentMission.line2.label}
                  </div>
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-3">
                <div className="text-xs font-mono uppercase text-slate-400 font-bold">
                  🕹️ TOMBOL GESER BIDIKAN (X, Y):
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                    <button
                      onClick={() => {
                        setFiredResult(null);
                        setAimX((x) => Math.max(-5, x - 1));
                      }}
                      className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold text-white"
                    >
                      -
                    </button>
                    <span className="font-mono font-bold text-sky-300 text-sm">
                      X = {aimX}
                    </span>
                    <button
                      onClick={() => {
                        setFiredResult(null);
                        setAimX((x) => Math.min(5, x + 1));
                      }}
                      className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold text-white"
                    >
                      +
                    </button>
                  </div>

                  <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                    <button
                      onClick={() => {
                        setFiredResult(null);
                        setAimY((y) => Math.max(-5, y - 1));
                      }}
                      className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold text-white"
                    >
                      -
                    </button>
                    <span className="font-mono font-bold text-indigo-300 text-sm">
                      Y = {aimY}
                    </span>
                    <button
                      onClick={() => {
                        setFiredResult(null);
                        setAimY((y) => Math.min(5, y + 1));
                      }}
                      className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold text-white"
                    >
                      +
                    </button>
                  </div>
                </div>
              </div>

              {firedResult === 'miss' && (
                <div className="p-3.5 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-200 text-xs font-mono animate-shake">
                  💡 Koordinat ({aimX}, {aimY}) belum tepat! Coba masukkan nilai x dan y pilihanmu ke dalam kedua persamaan untuk mengecek apakah hasilnya cocok!
                </div>
              )}

              {firedResult === 'hit' ? (
                <div className="p-4 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 space-y-3 animate-pop">
                  <div className="font-display font-bold text-base text-emerald-300">
                    🎯 TEPAT SASARAN! Titik Potong ({aimX}, {aimY}) (+{levelData.pointsPerCorrect} Poin)
                  </div>
                  <p className="text-xs font-mono text-slate-300">
                    {currentMission.explanation}
                  </p>
                  <button
                    onClick={handleNextMission}
                    className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-display font-bold text-sm transition"
                  >
                    {missionIdx + 1 < missions.length ? 'Target Radar Berikutnya →' : 'Selesaikan Misi Radar 🏆'}
                  </button>
                </div>
              ) : (
                <button
                  onClick={handleFireSniper}
                  className="w-full py-4 rounded-xl font-display font-bold text-base text-white bg-indigo-600 hover:bg-indigo-500 transition shadow-md"
                >
                  🎯 KUNCI &amp; TEMBAK KOORDINAT ({aimX}, {aimY})!
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // COMPONENT 4: GAME CENTER CONTAINER
    // ========================================================================
    function GameCenterView({ state, initialGameId, onRecordGameAnswer, onFinishGameSession }) {
      const games = window.NEXUS_DATA.games;
      const [activeGameId, setActiveGameId] = useState(initialGameId || null);
      const [selectedLevel, setSelectedLevel] = useState(1);
      const [roundSummary, setRoundSummary] = useState(null);

      useEffect(() => {
        if (initialGameId) {
          setActiveGameId(initialGameId);
          setSelectedLevel(1);
          setRoundSummary(null);
        }
      }, [initialGameId]);

      const activeGame = games.find((g) => g.id === activeGameId);
      const levelData = activeGame ? activeGame.levels[selectedLevel] : null;

      const handleCompleteRound = ({ sessionScore, sessionCorrect, totalQuestions }) => {
        setRoundSummary({ sessionScore, sessionCorrect, totalQuestions });
        onFinishGameSession({
          gameId: activeGame.id,
          level: selectedLevel,
          sessionScore
        });
      };

      if (!activeGame) {
        return (
          <div className="space-y-6 animate-fade-slide">
            <div className="glass-panel rounded-2xl p-6 sm:p-8 border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <span className="px-3 py-1 rounded-full text-xs font-mono bg-indigo-500/15 text-indigo-300 border border-indigo-500/30">
                  🎮 GAME CENTER ARENA • EDISI BELAJAR RINGAN &amp; INTERAKTIF
                </span>
                <h2 className="font-display text-2xl sm:text-3xl font-bold text-white mt-2">
                  Pilih Arena Permainan Matematikamu
                </h2>
                <p className="text-slate-300 text-sm mt-1">

    function PassionAnalysisView({ state, onAnswerPassionQuestion }) {
      const { gameStats, completedModules, passionAnswers, user } = state;
      const questions = window.NEXUS_DATA.passionQuestions;

      const algG1 = gameStats['game-speed'] || {};
      const algG2 = gameStats['game-factor'] || {};
      const algTotalAnswered = (algG1.totalAnswered || 0) + (algG2.totalAnswered || 0);
      const algCorrect = (algG1.correct || 0) + (algG2.correct || 0);
      const algAccuracy = algTotalAnswered > 0 ? Math.round((algCorrect / algTotalAnswered) * 100) : 0;
      const algPoints = (algG1.pointsEarned || 0) + (algG2.pointsEarned || 0);
      const algTotalTime = (algG1.totalTimeSec || 0) + (algG2.totalTimeSec || 0);
      const algAvgSpeed = algTotalAnswered > 0 ? (algTotalTime / algTotalAnswered).toFixed(1) : 0;
      const algModulesDone = completedModules.filter((id) => id.startsWith('alg-')).length;

      const splG3 = gameStats['game-hunter'] || {};
      const splG4 = gameStats['game-graph'] || {};
      const splTotalAnswered = (splG3.totalAnswered || 0) + (splG4.totalAnswered || 0);
      const splCorrect = (splG3.correct || 0) + (splG4.correct || 0);
      const splAccuracy = splTotalAnswered > 0 ? Math.round((splCorrect / splTotalAnswered) * 100) : 0;
      const splPoints = (splG3.pointsEarned || 0) + (splG4.pointsEarned || 0);
      const splTotalTime = (splG3.totalTimeSec || 0) + (splG4.totalTimeSec || 0);
      const splAvgSpeed = splTotalAnswered > 0 ? (splTotalTime / splTotalAnswered).toFixed(1) : 0;
      const splModulesDone = completedModules.filter((id) => id.startsWith('spldv-')).length;

      const qValues = Object.values(passionAnswers || {});
      const qAljabarCount = qValues.filter((v) => v === 'aljabar').length;
      const qSpldvCount = qValues.filter((v) => v === 'spldv').length;

      const aljabarCompositeScore = Math.min(
        100,
        Math.round(
          algAccuracy * 0.45 +
            algModulesDone * 6 +
            Math.min(25, algPoints / 2) +
            qAljabarCount * 5
        )
      );

      const spldvCompositeScore = Math.min(
        100,
        Math.round(
          splAccuracy * 0.45 +
            splModulesDone * 6 +
            Math.min(25, splPoints / 2) +
            qSpldvCount * 5
        )
      );

      let dominantCategory = 'Aljabar';
      let dominantBadge = 'SYMBOLIC ALGEBRA ARCHITECT';
      let dominantAccent = 'emerald';

      if (spldvCompositeScore > aljabarCompositeScore) {
        dominantCategory = 'SPLDV (Sistem Persamaan Linear Dua Variabel)';
        dominantBadge = 'STRATEGIC SPLDV COMMANDER';
        dominantAccent = 'sky';
      } else if (
        spldvCompositeScore === aljabarCompositeScore &&
        spldvCompositeScore > 0
      ) {
        dominantCategory = 'Aljabar & SPLDV (Seimbang / All-Rounder)';
        dominantBadge = 'DUAL NEXUS GRANDMASTER';
        dominantAccent = 'indigo';
      }

      return (
        <div className="space-y-6 animate-fade-slide">
          <div className="glass-panel rounded-2xl p-6 sm:p-8 border border-slate-800 relative overflow-hidden">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6">

                </div>

                  <div className="text-xs font-mono uppercase text-sky-400 mb-1">

                  </div>
                  <p className="text-base sm:text-lg font-medium text-white leading-relaxed">
                    &ldquo;Berdasarkan performa game dan kuesionermu, kamu punya passion/kecenderungan lebih kuat di bagian{' '}
                    <span className="font-display font-extrabold text-sky-400 underline decoration-indigo-400 underline-offset-4">
                      [{dominantCategory}]
                    </span>{' '}
                    karena kecepatan dan ketelitianmu lebih menonjol di sana!&rdquo;
                  </p>
                </div>
              </div>

              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 text-center sm:min-w-[250px] shrink-0">
                <div className="text-4xl mb-2">
                  {dominantAccent === 'emerald' ? '⚡' : dominantAccent === 'sky' ? '🎯' : '👑'}
                </div>

                  </div>

                    <div className="text-sky-400 font-bold text-base">{spldvCompositeScore}%</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="glass-panel rounded-2xl p-6 border-t-4 border-t-emerald-500 space-y-5">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-xs font-mono uppercase text-emerald-400 font-bold">
                    KATEGORI 01 • DRAG-DROP &amp; KOTAK MISTERI
                  </span>
                  <h3 className="font-display text-2xl font-bold text-white mt-0.5">

                </div>
                <div className="px-3.5 py-2 rounded-xl bg-emerald-500/15 border border-emerald-500/30 font-display font-bold text-xl text-emerald-300">

                </div>
              </div>

              <div className="w-full h-2.5 rounded-full bg-slate-950 overflow-hidden border border-slate-800">
                <div
                  className="h-full bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-500"
                  style={{ width: `${Math.max(5, aljabarCompositeScore)}%` }}
                ></div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800">
                  <div className="text-xs font-mono text-slate-400">Akurasi Game Aljabar</div>

                    {algPoints} PTS
                  </div>
                  <div className="text-[11px] text-slate-400 font-mono">
                    Speed Matcher &amp; Kotak Misteri
                  </div>
                </div>
                <div className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800">
                  <div className="text-xs font-mono text-slate-400">Progress Modul Aljabar</div>
                  <div className="font-display text-xl font-bold text-white mt-1">
                    {algModulesDone}/5 Modul
                  </div>
                  <div className="text-[11px] text-slate-400 font-mono">
                    Minat Kuesioner: {qAljabarCount}/5
                  </div>
                </div>

            </div>

            <div className="glass-panel rounded-2xl p-6 border-t-4 border-t-indigo-500 space-y-5">
