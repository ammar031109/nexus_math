    function App() {
      const [accountsDB, setAccountsDB] = useState(loadAccountsDB);
      const [activeAccountId, setActiveAccountId] = useState(() => {
        try {
          const savedActive = localStorage.getItem(ACTIVE_USER_KEY);
          const db = loadAccountsDB();
          if (savedActive && db[savedActive]) return savedActive;
          return null;
        } catch (e) {
          return null;
        }
      });

      const [authView, setAuthView] = useState('landing'); // 'landing' | 'login'
      const [activeTab, setActiveTab] = useState('dashboard');
      const [materiSubCategory, setMateriSubCategory] = useState('all');
      const [targetGameId, setTargetGameId] = useState(null);
      const [muted, setMuted] = useState(window.NexusSound.isMuted());
      const [toast, setToast] = useState(null);

      // Sync accountsDB to localStorage whenever it updates
      useEffect(() => {
        saveAccountsDB(accountsDB);
      }, [accountsDB]);

      // Sync activeAccountId to localStorage
      useEffect(() => {
        try {
          if (activeAccountId) {
            localStorage.setItem(ACTIVE_USER_KEY, activeAccountId);
          } else {
            localStorage.removeItem(ACTIVE_USER_KEY);
          }
        } catch (e) {}
      }, [activeAccountId]);

      const currentProfile = activeAccountId ? accountsDB[activeAccountId] : null;

      const updateCurrentProfile = (updater) => {
        if (!activeAccountId) return;
        setAccountsDB((prevDB) => {
          const existing = prevDB[activeAccountId];
          if (!existing) return prevDB;
          const updated = updater(existing);
          return {
            ...prevDB,
            [activeAccountId]: {
              ...updated,
              lastUpdated: new Date().toLocaleString('id-ID')
            }
          };
        });
      };

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => {
          setToast((prev) => (prev && prev.msg === msg ? null : prev));
        }, 3200);
      };

      // Login or Resume Existing Account without losing any progress!
      const handleLogin = (userData) => {
        const accId = makeAccountId(userData.name, userData.kelas);
        setAccountsDB((prevDB) => {
          if (prevDB[accId]) {
            // Resume existing account & update avatar if changed
            return {
              ...prevDB,
              [accId]: {
                ...prevDB[accId],
                user: {
                  ...prevDB[accId].user,
                  avatar: userData.avatar || prevDB[accId].user.avatar
                }
              }
            };
          } else {
            // Create new account profile
            return {
              ...prevDB,
              [accId]: createBlankProfile(userData)
            };
          }
        });
        setActiveAccountId(accId);
        setActiveTab('dashboard');
        showToast(`Selamat datang, ${userData.name} (${userData.kelas})! Data belajarmu aktif.`);
      };

      // Logout keeps all progress saved in accountsDB
      const handleLogoutKeepData = (targetScreen = 'landing') => {
        window.NexusSound.click();
        setActiveAccountId(null);
        setTargetGameId(null);
        setAuthView(targetScreen);
      };

      const handleDeleteSavedAccount = (accId) => {
        window.NexusSound.click();
        setAccountsDB((prevDB) => {
          const copy = { ...prevDB };
          delete copy[accId];
          return copy;
        });
      };

      const handleLoadDemo = () => {
        window.NexusSound.levelUp();
        const demoUser = {
          name: 'Nadia Putri',
          kelas: 'XI SIJA 1',
          avatar: '🦸‍♀️'
        };
        const accId = makeAccountId(demoUser.name, demoUser.kelas);
        const demoProfile = {
          user: demoUser,
          points: 118,
          completedModules: ['alg-1', 'alg-2', 'alg-3', 'alg-4', 'spldv-1', 'spldv-2', 'spldv-3'],
          moduleQuizDone: { 'alg-1': 0, 'alg-2': 0, 'spldv-1': 0 },
          gameStats: {
            'game-speed': {
              played: 3,
              correct: 9,
              totalAnswered: 10,
              pointsEarned: 32,
              totalTimeSec: 65,
              bestByLevel: { 1: 16, 2: 20, 3: 0 }
            },
            'game-factor': {
              played: 2,
              correct: 7,
              totalAnswered: 8,
              pointsEarned: 25,
              totalTimeSec: 72,
              bestByLevel: { 1: 8, 2: 20, 3: 0 }
            },
            'game-hunter': {
              played: 2,
              correct: 4,
              totalAnswered: 5,
              pointsEarned: 11,
              totalTimeSec: 84,
              bestByLevel: { 1: 6, 2: 10, 3: 0 }
            },
            'game-graph': {
              played: 1,
              correct: 3,
              totalAnswered: 4,
              pointsEarned: 9,
              totalTimeSec: 60,
              bestByLevel: { 1: 6, 2: 5, 3: 0 }
            }
          },
          passionAnswers: {
            q1: 'aljabar',
            q2: 'aljabar',
            q3: 'spldv',
            q4: 'aljabar',
            q5: 'aljabar'
          },
          lastUpdated: 'Hari Ini'
        };
        setAccountsDB((prev) => ({
          ...prev,
          [accId]: demoProfile
        }));
        setActiveAccountId(accId);
        setActiveTab('dashboard');
        showToast('Akun Demo (XI SIJA 1) berhasil dimuat & disimpan!');
      };

      const handleToggleCompleteModule = (moduleId, xpReward) => {
        updateCurrentProfile((prev) => {
          const exists = prev.completedModules.includes(moduleId);
          let nextCompleted;
          let nextPoints = prev.points;
          if (exists) {
            window.NexusSound.click();
            nextCompleted = prev.completedModules.filter((id) => id !== moduleId);
            nextPoints = Math.max(0, prev.points - xpReward);
            showToast(`Status selesai dibatalkan (${nextCompleted.length}/10)`, 'info');
          } else {
            window.NexusSound.completeModule();
            nextCompleted = [...prev.completedModules, moduleId];
            nextPoints = prev.points + xpReward;
            showToast(`Sub-Materi Selesai! +${xpReward} Poin tersimpan (${nextCompleted.length}/10)`);
          }
          return {
            ...prev,
            completedModules: nextCompleted,
            points: nextPoints
          };
        });
      };

      const handleAnswerMiniQuiz = (moduleId, selectedIdx, isCorrect) => {
        if (isCorrect) {
          window.NexusSound.correct();
        } else {
          window.NexusSound.wrong();
        }
        updateCurrentProfile((prev) => {
          const alreadyAnswered = prev.moduleQuizDone[moduleId] !== undefined;
          return {
            ...prev,
            points: !alreadyAnswered && isCorrect ? prev.points + 2 : prev.points,
            moduleQuizDone: {
              ...prev.moduleQuizDone,
              [moduleId]: selectedIdx
            }
          };
        });
      };

      const handleRecordGameAnswer = ({ gameId, isCorrect, pointsEarned, elapsedSec }) => {
        updateCurrentProfile((prev) => {
          const cur = prev.gameStats[gameId] || {
            played: 0,
            correct: 0,
            totalAnswered: 0,
            pointsEarned: 0,
            totalTimeSec: 0,
            bestByLevel: { 1: 0, 2: 0, 3: 0 }
          };
          return {
            ...prev,
            points: prev.points + pointsEarned,
            gameStats: {
              ...prev.gameStats,
              [gameId]: {
                ...cur,
                correct: cur.correct + (isCorrect ? 1 : 0),
                totalAnswered: cur.totalAnswered + 1,
                pointsEarned: cur.pointsEarned + pointsEarned,
                totalTimeSec: cur.totalTimeSec + elapsedSec
              }
            }
          };
        });
      };

      const handleFinishGameSession = ({ gameId, level, sessionScore }) => {
        updateCurrentProfile((prev) => {
          const cur = prev.gameStats[gameId];
          const prevBest = (cur.bestByLevel && cur.bestByLevel[level]) || 0;
          return {
            ...prev,
            gameStats: {
              ...prev.gameStats,
              [gameId]: {
                ...cur,
                played: (cur.played || 0) + 1,
                bestByLevel: {
                  ...(cur.bestByLevel || { 1: 0, 2: 0, 3: 0 }),
                  [level]: Math.max(prevBest, sessionScore)
                }
              }
            }
          };
        });
        showToast(`Misi selesai! +${sessionScore} Poin tersimpan di akunmu!`);
      };

      const handleAnswerPassionQuestion = (qId, category) => {
        updateCurrentProfile((prev) => ({
          ...prev,
          passionAnswers: {
            ...prev.passionAnswers,
            [qId]: category
          }
        }));
      };

      if (!currentProfile) {
        if (authView === 'login') {
          return (
            <LoginScreen
              accountsDB={accountsDB}
              onBackToLanding={() => setAuthView('landing')}
              onLogin={handleLogin}
              onDeleteSavedAccount={handleDeleteSavedAccount}
              onLoadDemo={handleLoadDemo}
            />
          );
        }
        return (
          <LandingScreen
            accountsDB={accountsDB}
            onGoToLogin={() => setAuthView('login')}
            onLoadDemo={handleLoadDemo}
          />
        );
      }

      const levelInfo = getLevelInfo(currentProfile.points);
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: '🏠' },
        { id: 'materi', label: `Materi (${currentProfile.completedModules.length}/10)`, icon: '📘' },
        { id: 'games', label: 'Game Center', icon: '🎮' },
        { id: 'passion', label: 'Analisis Passion', icon: '🧠' }
      ];

      return (
        <div className="min-h-screen flex flex-col pb-20 md:pb-10">
          {toast && (
            <div className="fixed bottom-20 md:bottom-6 right-4 z-50 px-4 py-3 rounded-xl bg-slate-900/95 border border-indigo-400/50 text-slate-100 text-xs sm:text-sm font-mono shadow-xl animate-pop flex items-center gap-2">
              <span>✨</span>
              <span>{toast.msg}</span>
            </div>
          )}

          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <div
                onClick={() => setActiveTab('dashboard')}
                className="flex items-center gap-3 cursor-pointer"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-sky-500 flex items-center justify-center font-display font-bold text-lg text-white shadow-sm">
                  ∑
                </div>
                <div>
                  <div className="font-display font-bold text-base sm:text-lg text-white leading-none">
                    NEXUS <span className="text-indigo-400">MATH</span>
                  </div>
                  <div className="text-[10px] font-mono text-slate-400 mt-0.5">
                    ALJABAR &amp; SPLDV PORTAL
                  </div>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-1.5 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800">
                {navItems.map((item) => {
                  const active = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => {
                        window.NexusSound.click();
                        setTargetGameId(null);
                        setActiveTab(item.id);
                      }}
                      className={`px-4 py-2 rounded-xl text-xs font-mono font-semibold transition flex items-center gap-2 ${
                        active
                          ? 'bg-indigo-600 text-white shadow-sm'
                          : 'text-slate-300 hover:text-white hover:bg-slate-800'
                      }`}
                    >
                      <span>{item.icon}</span>
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </nav>

              <div className="flex items-center gap-2.5">
                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700/80 text-xs font-mono">
                  <span className="text-emerald-400 font-bold">💎 {currentProfile.points} PTS</span>
                  <span className="text-slate-600">|</span>
                  <span className="text-sky-400 font-bold">Lv.{levelInfo.level}</span>
                </div>

                <button
                  onClick={() => setMuted(window.NexusSound.toggleMute())}
                  title={muted ? 'Aktifkan Suara' : 'Matikan Suara'}
                  className="w-9 h-9 rounded-xl bg-slate-900 border border-slate-700/80 flex items-center justify-center text-sm hover:border-slate-500 transition"
                >
                  {muted ? '🔇' : '🔊'}
                </button>

                <div className="flex items-center gap-2 pl-2 border-l border-slate-800">
                  <span className="text-lg">{currentProfile.user.avatar}</span>
                  <div className="hidden lg:block text-left">
                    <div className="text-xs font-bold text-white leading-none">
                      {currentProfile.user.name}
                    </div>
                    <div className="text-[10px] font-mono text-sky-400">
                      {currentProfile.user.kelas}
                    </div>
                  </div>
                  <button
                    onClick={() => handleLogoutKeepData('login')}
                    title="Ganti Akun (Data tetap tersimpan aman)"
                    className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-[11px] font-mono transition"
                  >
                    Ganti Akun
                  </button>
                  <button
                    onClick={() => handleLogoutKeepData('landing')}
                    title="Keluar ke Halaman Awal (Data tetap tersimpan aman)"
                    className="px-2.5 py-1.5 rounded-lg bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-400/30 text-indigo-200 text-[11px] font-mono transition"
                  >
                    Keluar
                  </button>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl w-full mx-auto px-4 pt-6 flex-1">
            {activeTab === 'dashboard' && (
              <DashboardView
                state={currentProfile}
                setActiveTab={setActiveTab}
                onOpenModule={(cat) => {
                  window.NexusSound.click();
                  setMateriSubCategory(cat);
                  setActiveTab('materi');
                }}
                onOpenGame={(gId) => {
                  window.NexusSound.click();
                  setTargetGameId(gId);
                  setActiveTab('games');
                }}
              />
            )}

            {activeTab === 'materi' && (
              <MateriView
                state={currentProfile}
                initialCategory={materiSubCategory}
                onToggleCompleteModule={handleToggleCompleteModule}
                onAnswerMiniQuiz={handleAnswerMiniQuiz}
              />
            )}

            {activeTab === 'games' && (
              <GameCenterView
                state={currentProfile}
                initialGameId={targetGameId}
                onRecordGameAnswer={handleRecordGameAnswer}
                onFinishGameSession={handleFinishGameSession}
              />
            )}

            {activeTab === 'passion' && (
              <PassionAnalysisView
                state={currentProfile}
                onAnswerPassionQuestion={handleAnswerPassionQuestion}
              />
            )}
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 glass-panel border-t border-slate-800 px-2 py-2 flex items-center justify-around">
            {navItems.map((item) => {
              const active = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => {
                    window.NexusSound.click();
                    setTargetGameId(null);
                    setActiveTab(item.id);
                  }}
                  className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl text-[11px] font-mono font-semibold transition ${
                    active
                      ? 'bg-indigo-600 text-white'
                      : 'text-slate-400'
                  }`}
                >
                  <span className="text-base">{item.icon}</span>
                  <span>{item.label.split(' ')[0]}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
